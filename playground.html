<body>

<section class="world" data-mode="full" aria-label="Robot world">
  <canvas class="w-canvas" id="world" aria-label="A 3D world with robots at project stations. Use the station buttons to visit each one."></canvas>
  <div class="w-edge" aria-hidden="true"></div>
  <div class="w-labels" id="labels" aria-hidden="true"></div>

  <p class="w-hud w-tl"><a class="w-name" href="index.html">Max Yuan</a><span>robot learning lab</span></p>
  <nav class="w-hud w-tr" aria-label="Site">
    <a href="index.html#projects">projects</a>
    <a href="resume.pdf" target="_blank" rel="noopener">résumé ↗</a>
  </nav>
  <p class="w-hud w-bl" id="w-weather">Waterloo, ON</p>
  <p class="w-hud w-br" id="w-clock"></p>

  <section class="w-card" id="card" aria-live="polite" hidden>
    <button class="w-card-close" type="button" aria-label="Close">×</button>
    <p class="w-card-robot"></p>
    <h2 class="w-card-title"></h2>
    <p class="w-card-line"></p>
    <ul class="w-card-tags"></ul>
    <a class="w-card-go" href="#">Imagine it →</a>
  </section>

  <div class="w-dock">
    <p class="w-hint" id="hint">Click a station or the floor to drive the BracketBot. Arrow keys work too.</p>
    <nav class="w-stations" id="stations" aria-label="Project stations"></nav>
  </div>

  <p class="w-status" id="status" role="status">Loading robots…</p>
</section>

<noscript><p>The robot world needs JavaScript. The <a href="index.html">home page</a> lists every project.</p></noscript>

</body>
